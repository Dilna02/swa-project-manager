<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWA Project Manager</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b1f24;--mu:#5f6b7a;--bd:#d5dbe3;--ac:#1f4e9c;--acx:#fff;--ok:#cfeed3;--bad:#ffd0d0;--warn:#E9EEF6;--blk:#E9E3F5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--cd:#1e242b;--tx:#e8ecf1;--mu:#98a4b3;--bd:#33404d;--ac:#7fb0ff;--acx:#0d1722;--ok:#1f4a2b;--bad:#5a2323;--warn:#2B323C;--blk:#3A2F52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--cd:#1e242b;--tx:#e8ecf1;--mu:#98a4b3;--bd:#33404d;--ac:#7fb0ff;--acx:#0d1722;--ok:#1f4a2b;--bad:#5a2323;--warn:#2B323C;--blk:#3A2F52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:16px 0 8px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.scroll{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu)}
.fl{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px;white-space:nowrap}
.ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:var(--warn)}.blk{background:var(--blk)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu)}label input,label select,label textarea{width:100%;box-sizing:border-box;margin-top:2px;color:var(--tx)}
details{margin-top:4px}summary{cursor:pointer;color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hd{cursor:grab;font-size:18px;padding:0 4px;user-select:none}tr.over td{border-top:3px solid var(--ac)}
body{padding:16px;max-width:1280px;margin:0 auto;line-height:1.5}
h1{font-size:20px;letter-spacing:-.2px}h2{font-size:15px}
.top{padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabs{gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tabs button{border:0;background:transparent;color:var(--mu);border-radius:8px 8px 0 0;padding:9px 14px;border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{background:transparent;color:var(--ac);border-bottom-color:var(--ac)}
button{border-radius:8px;padding:7px 12px}button:hover{filter:brightness(.95)}
input,select,textarea{border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
.card,.scroll{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.card{padding:16px}
th{text-transform:uppercase;letter-spacing:.04em;font-size:11px;padding:10px 12px;background:color-mix(in srgb,var(--mu) 8%,transparent)}
td{padding:10px 12px}tr:last-child td{border-bottom:0}
tr:hover td{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.fl{font-size:11px;padding:3px 10px}
.xr{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.xr>summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none;color:var(--tx)}
.xr>summary::-webkit-details-marker{display:none}
.xr>summary::before{content:"▸";color:var(--mu);display:inline-block;transition:transform .15s}
.xr[open]>summary::before{transform:rotate(90deg)}
.xr .sn{font-weight:600;flex:1 1 180px}.xr .st{color:var(--mu);font-size:12px}
.xr .xb{padding:12px 14px 14px;border-top:1px solid var(--bd)}
.th{height:48px;width:48px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);margin:4px 4px 0 0;cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}.lb img{max-width:92%;max-height:92%;border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.tile{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.tile .tn{font-size:24px;font-weight:700}.tile .tl{color:var(--mu);font-size:12px}.tile.ok{background:var(--ok)}.tile.bad{background:var(--bad)}
.at{padding:4px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--mu)}.dot.bad{background:#d9534f}.dot.warn{background:#8A96A8}
.ev,.tk{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}.ev:last-child,.tk:last-child{border-bottom:0}
.ev .dt{min-width:54px;font-size:12px;color:var(--mu);font-weight:600}
.ck{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;font-size:12px}.ck.ok{background:var(--ok)}.ck.bad{background:var(--bad)}
.xb h3{font-size:13px;margin:14px 0 4px}.why{background:var(--warn);border-radius:8px;padding:8px 10px}
.pr-High{border-left:4px solid #d9534f}.pr-Medium{border-left:4px solid #8A96A8}.pr-Low{border-left:4px solid #5cb85c}
.rd-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
#rdrawer{display:none}
.rd-pn{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--cd);color:var(--tx);z-index:71;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
.rd-hd{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rd-msg{padding:6px 16px;font-size:12px;color:var(--mu);min-height:8px}
.rd-bd{overflow:auto;flex:1;padding:18px 22px;background:#fff;color:#222}
.pt{width:100%}
.pt td{vertical-align:top;padding:9px 10px;font-size:13px}
.pt th{padding:9px 10px;white-space:nowrap}
.pt tr:hover td{background:color-mix(in srgb,var(--ac) 4%,transparent)}
.pt .nw{white-space:nowrap}
.pt .ord{white-space:nowrap;width:1%}
.pt .pn{font-weight:600;min-width:120px}
.pt input[type=date]{width:128px;padding:4px 6px;font-size:12px}
.pt select{padding:4px 6px;font-size:12px;max-width:150px}
.pt .why{min-width:240px}
.pt .ln{line-height:1.4;margin:3px 0}
.pt details{margin-top:2px}.pt summary{font-size:12px;cursor:pointer}
.clip{display:block;font-weight:500;white-space:normal;overflow-wrap:anywhere}
.btn-sm{padding:2px 9px;font-size:12px;border-radius:6px;margin-top:3px}
button.ic{padding:1px 6px;font-size:11px;line-height:1.4;margin:0 1px;border-radius:5px}
.pt .hd{cursor:grab;color:var(--mu);margin-right:4px;font-size:15px;vertical-align:middle}
.exp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff;padding:12px}#printArea table{min-width:0;width:100%}#printArea td,#printArea th{border:1px solid #999;color:#000;font-size:11px;padding:4px}#printArea th{background:#eee}}
.dsh{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dc{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.sd{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle}
.sd.g{background:#2e9e4f}.sd.y{background:#e0a800}.sd.r{background:#d9534f}
.sb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--mu) 18%,transparent);margin:8px 0 5px}
.sb i{display:block}.sb .d{background:#2e9e4f}.sb .o{background:#8A96A8}.sb .l{background:#d9534f}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .bar{width:100%;max-width:34px;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
</style></head><body><div id="printArea"></div>
<div id="app">Loading…</div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const ST=["Not Started","In Development","Ready for QA","QA In Progress","Bug Fixing","Blocked / On Hold","Released"];
let db,me=null,isAdmin=false,projects=[],updates=[],users=[],tasks=[],tf={p:"",d:""},tsub="all",tab="",assigning=null,pending=false,loginMsg="",note="";
const byOrder=(a,b)=>(a.order??1e9)-(b.order??1e9)||a.name.localeCompare(b.name);
const devs=()=>users.filter(u=>u.role==="developer");
function nm(id){if(!id)return"Not assigned";const u=users.find(x=>x.id===id);return u?u.name:"Removed user"}
function lastUp(pid){return updates.find(u=>u.projectId===pid)}
function stOf(p){const l=lastUp(p.id);return p.status==="Released"?"Released":(l&&l.status)||p.status}
function flag(p){
  const s=stOf(p);
  if(s==="Released")return["DONE","ok"];
  if(!p.assignee)return["ASSIGN DEVELOPER","warn"];
  if(s==="Blocked / On Hold")return["BLOCKED","blk"];
  if(!p.committed)return["GET DATE","warn"];
  if(p.committed<today())return["OVERDUE","bad"];
  return["ON TRACK","ok"];
}
const fl=p=>{const[t,c]=flag(p);return`<span class="fl ${c}">${t}</span>`};
const dt=d=>d?esc(d):"—";

function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3)";document.body.append(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display="none"},5000)}
window.alert=toast;
let delId=null;
const themeKey="swa_theme";
function getTheme(){try{return localStorage.getItem(themeKey)||"auto"}catch(e){return"auto"}}
function applyTheme(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}
function themeLabel(){const t=getTheme();return t==="light"?"☀ Light":t==="dark"?"☾ Dark":"◐ Auto"}
applyTheme(getTheme());
function vLogin(){return`<div class="card" style="max-width:360px;margin:40px auto"><h1>SWA Project Manager</h1>
<div class="mu" style="margin:6px 0 12px">Sign in with the username and password given by your admin.</div>
<label>Username<input id="lu" autocomplete="username" autocapitalize="none"></label>
<label style="margin-top:8px">Password<input id="lp" type="password" autocomplete="current-password"></label>
<div class="row" style="margin-top:10px"><button class="pri" data-act="login">Sign in</button><button data-act="theme" title="Switch light / dark">${themeLabel()}</button></div>
${loginMsg?`<div style="margin-top:8px"><span class="fl bad">${esc(loginMsg)}</span></div>`:""}</div>`}
async function doLogin(){
  const u=$("#lu").value.trim(),pw=$("#lp").value;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  try{const r=await api("POST","/api/login",{username:u,password:pw});
    me={id:r.id,name:r.name};isAdmin=r.role==="admin";tab=isAdmin?"today":"mine";loginMsg="";pending=false;db.reset();await db.refresh();render()}
  catch(e){loginMsg=e.message;pending=false;render()}
}
function render(){
  const a=document.activeElement;
  if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}
  pending=false;
  if(!me){app.innerHTML=vLogin();return}
  const tabs=isAdmin?[["today","Dashboard"],["update","Add update"],["projects","Projects"],["tasks","Tasks"],["developers","Developers"],["weekly","Weekly summary"],["account","Account"]]:[["mine","My projects"],["mytasks","My tasks"],["account","Account"]];
  app.innerHTML=`<div class="top"><div><h1>SWA Project Manager</h1><div class="mu">${esc(me.name)} · ${isAdmin?"Admin":"Developer"} · ${today()}</div></div><div class="row"><button data-act="theme" title="Switch light / dark">${themeLabel()}</button><button data-act="logout">Sign out</button></div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-act="tab" data-k="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>
  ${tab==="today"?vDash():tab==="projects"?vProjects():tab==="tasks"?vTasks():tab==="update"?vAdminUpdate():tab==="mytasks"?vMyTasks():tab==="developers"?vDevs():tab==="weekly"?vWeekly():tab==="account"?vAccount():vMine()}`;
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},300));

function vDash(){
  const T=today(),dv=devs(),open=t=>t.status!=="Done",od=t=>open(t)&&!!t.due&&t.due<T;
  const upToday=u=>updates.some(x=>x.userId===u&&x.date===T);
  const rows=dv.map(d=>{
    const mine=tasks.filter(t=>t.assignee===d.id),op=mine.filter(open);
    const done=mine.length-op.length,late=op.filter(od).length,ontime=op.length-late;
    const dueT=op.filter(t=>t.due===T).length,nod=op.filter(t=>!t.due).length,up=upToday(d.id);
    const c=late?"r":(dueT||nod||(op.length&&!up))?"y":"g";
    return{d,total:mine.length,done,late,ontime,dueT,nod,up,c};
  }).sort((a,b)=>"ryg".indexOf(a.c)-"ryg".indexOf(b.c)||a.d.name.localeCompare(b.d.name));
  const all=tasks,doneN=all.filter(t=>!open(t)).length,odN=all.filter(od).length,penN=all.length-doneN;
  const upN=rows.filter(r=>r.up).length;
  const tile=(n,l,c)=>`<div class="tile ${c||""}"><div class="tn">${n}</div><div class="tl">${l}</div></div>`;
  const cards=rows.map(r=>{const t=r.total||1,lb={r:"Overdue",y:"Needs a look",g:"On track"}[r.c];
    return`<div class="dc"><div><span class="sd ${r.c}"></span><b>${esc(r.d.name)}</b></div><div class="mu">${lb} · ${r.up?"updated today":"no update today"}</div>
    <div class="sb"><i class="d" style="width:${r.done/t*100}%"></i><i class="o" style="width:${r.ontime/t*100}%"></i><i class="l" style="width:${r.late/t*100}%"></i></div>
    <div class="mu">${r.done} done · ${r.ontime} on time · ${r.late} overdue</div></div>`}).join("")||'<div class="mu">No developers yet.</div>';
  const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-(6-i));return iso(x)});
  const cnt=days.map(d=>all.filter(t=>t.doneOn===d).length),mx=Math.max(1,...cnt);
  const chart=days.map((d,i)=>`<div title="${cnt[i]} done on ${d}"><span class="mu">${cnt[i]}</span><div class="bar" style="height:${cnt[i]/mx*90}px"></div><span class="mu">${new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short"})}</span></div>`).join("");
  const late=all.filter(od).sort((a,b)=>a.due.localeCompare(b.due)).map(t=>{
    const n=Math.round((new Date(T+"T00:00")-new Date(t.due+"T00:00"))/864e5);
    return`<tr><td>${esc(nm(t.assignee))}</td><td>${esc(t.title)}</td><td>${esc(pname(t.projectId))}</td><td>${esc(t.due)}</td><td><span class="fl bad">${n} day${n===1?"":"s"} late</span></td></tr>`}).join("");
  const grps=GROUPS.map(g=>{const ps=projects.filter(p=>grp(p)===g);
    return`<tr><td><b>${g}</b></td><td>${ps.length}</td><td>${ps.filter(p=>stOf(p)==="Released").length}</td><td>${ps.filter(p=>flag(p)[0]==="OVERDUE").length}</td></tr>`}).join("");
  return`<div class="tiles">${tile(all.length,"Total tasks")}${tile(doneN,"Done","ok")}${tile(penN,"Pending")}${tile(odN,"Overdue",odN?"bad":"")}${tile(upN+" / "+dv.length,"Developers updated today")}</div>
  <h3 style="margin:14px 0 8px">Developers</h3><div class="dcards" style="margin-bottom:12px">${cards}</div>
  <div class="dsh"><div class="card"><b>Tasks completed, last 7 days</b><div class="chart">${chart}</div></div>
  <div class="card"><b>Projects by group</b><div class="scroll" style="margin-top:8px"><table style="min-width:0"><tr><th>Group</th><th>Projects</th><th>Released</th><th>Late</th></tr>${grps}</table></div></div></div>
  <div class="card"><b>Needs attention: overdue tasks</b><div class="scroll" style="margin-top:8px"><table><tr><th>Developer</th><th>Task</th><th>Project</th><th>Due</th><th>Late by</th></tr>${late||'<tr><td colspan="5">Nothing overdue.</td></tr>'}</table></div></div>
  <div class="mu" style="margin-bottom:12px">Status rule: red = at least one overdue task. Yellow = none overdue, but work due today, open work with no due date, or open work and no update today. Green = on track.</div>
  <details class="card"><summary>Project updates today</summary><div style="margin-top:8px">${vToday()}</div></details>`;
}
function vToday(){
  const rows=projects.slice().sort(byOrder).map(p=>{
    const l=lastUp(p.id),ud=l&&l.date===today();
    const hist=updates.filter(u=>u.projectId===p.id).slice(0,5).map(u=>`<div class="mu">${u.date} · ${esc(nm(u.userId))} · ${esc(u.status)} · ${esc(u.task)} → ${esc(u.next)} (${dt(u.nextDate)}) · final ${dt(u.finalDate)}${u.blocker?" · blocker: "+esc(u.blocker):""}${u.remark?" · "+esc(u.remark):""}</div>`).join("");
    const useBtn=l&&l.finalDate&&l.finalDate!==p.committed?` <button data-act="use" data-id="${p.id}">Use ${esc(l.finalDate)}</button>`:"";
    return`<tr><td><b>${esc(p.name)}</b></td><td>${esc(nm(p.assignee))}${!p.assignee&&p.devLabel?`<div class="mu">planned: ${esc(p.devLabel)}</div>`:""}</td><td>${esc(stOf(p))}</td><td>${dt(p.committed)}</td><td>${fl(p)}</td><td>${ud?"✓ Yes":"✗ No"}</td>
    <td>${l?`<b>${esc(l.task||"(no task text)")}</b>${l.next?`<div>Next: ${esc(l.next)}</div>`:""}<div class="mu">${esc(nm(l.userId))} · ${esc(l.date)} · Dev ${l.dev===""||l.dev==null?"—":esc(l.dev)}% · QA ${l.qa===""||l.qa==null?"—":esc(l.qa)}% · final ${dt(l.finalDate)}${esc(l.blocker?" · blocker: "+l.blocker:"")}${esc(l.reason?" · reason: "+l.reason:"")}${esc(l.remark?" · "+l.remark:"")}</div>${useBtn}`:'<span class="mu">no update yet</span>'}<details><summary>History</summary>${hist||'<div class="mu">none</div>'}</details></td></tr>`}).join("");
  const nu=projects.filter(p=>p.assignee&&stOf(p)!=="Released"&&!(lastUp(p.id)&&lastUp(p.id).date===today())).length;
  return`<div class="mu" style="margin-bottom:8px">${nu} assigned project(s) have no update today.</div><div class="scroll"><table><tr><th>Project</th><th>Developer</th><th>Status</th><th>Committed</th><th>Flag</th><th>Updated today</th><th>Latest update</th></tr>${rows||'<tr><td colspan="7">No projects yet.</td></tr>'}</table></div>`;
}
function pOpen(p){return tasks.filter(t=>t.projectId===p.id&&t.status!=="Done").sort(tcmp)}
function lines(arr,n){
  const top=arr.slice(0,n).map(x=>`<div class="ln">${x}</div>`).join("");
  const rest=arr.slice(n);
  return top+(rest.length?`<details><summary>+${rest.length} more</summary>${rest.map(x=>`<div class="ln">${x}</div>`).join("")}</details>`:"");
}
function pWhy(p){
  const u=lastUp(p.id),items=[];
  pOpen(p).forEach(t=>{if(t.pendingReason)items.push(`<b>${esc(t.title)}</b>: ${esc(t.pendingReason)}`)});
  if(u&&u.blocker)items.push(`Blocker: ${esc(u.blocker)}`);
  if(u&&u.reason)items.push(`Delay: ${esc(u.reason)}`);
  return items.length?lines(items,2):'<span class="mu">\u2014</span>';
}
function pRem(p){
  const o=pOpen(p);
  if(!o.length)return'<span class="mu">No open tasks</span>';

    await db.collection("tasks").add({projectId:pid,title,assignee:who,images,createdBy:me.id,createdByRole:"admin",status:"To Do",priority:$("#tpr").value,due:$("#td").value,note:$("#tn").value.trim(),createdOn:today(),doneOn:"",updatedTs:Date.now()});note="Task assigned";render()}
  else if(a==="addmine"){
    const pid=$("#mp").value,title=$("#mt").value.trim(),st=$("#ms").value;
    if(!pid||!title){alert("Choose a project and enter the task.");return}
    const images=await upFiles($("#mi"));
    await db.collection("tasks").add({projectId:pid,title,assignee:me.id,images,createdBy:me.id,createdByRole:"developer",status:st,priority:$("#mpr").value,due:$("#md").value,note:$("#mn").value.trim(),createdOn:today(),doneOn:st==="Done"?today():"",updatedTs:Date.now()});note="Task added";render()}
  else if(a==="delproj"){if(delId!==id){delId=id;render();return}delId=null;await db.doc("projects/"+id).delete();toast("Project deleted")}
  else if(a==="adddev"){
    const r=await api("POST","/api/users",{name:$("#dn").value.trim(),username:$("#du").value.trim(),password:$("#dp").value});
    await db.refresh();note=r.login?"Created login: "+r.id:"Added (no login): "+$("#dn").value.trim();render();
  }
  else if(a==="reset"){const pw=$("#rp_"+id).value;if(!pw){alert("Type a new password first.");return}
    await api("POST","/api/users/"+encodeURIComponent(id)+"/password",{password:pw});note="Password reset";render()}
  else if(a==="remove"){if(delId!==id){delId=id;render();return}delId=null;await api("DELETE","/api/users/"+encodeURIComponent(id));await db.refresh();toast("Developer removed")}
  else if(a==="chpw"){const pw=$("#np1").value;if(pw.length<4){alert("Use at least 4 characters.");return}
    await api("POST","/api/password",{password:pw});note="Password changed";render()}
  else if(a==="save"){
    const card=b.closest(".card"),d={projectId:id,userId:me.id,date:today(),ts:Date.now()};
    card.querySelectorAll("[name]").forEach(i=>d[i.name]=(i.type==="number"&&i.value!=="")?Number(i.value):i.value);
    await db.doc("updates/"+id+"_"+today()).set(d);
    const m=card.querySelector("[data-msg]");if(m)m.textContent="Saved ✓";
  }}catch(err){alert("Could not save: "+(err.message||err.code||err))}
});
app.addEventListener("change",async e=>{
  const f=e.target.dataset.f,id=e.target.dataset.id;if(!f||!isAdmin)return;const p=projects.find(x=>x.id===id),v=e.target.value;
  try{
    if(f==="committed")await db.doc("projects/"+id).update({committed:v,dateLog:[...(p.dateLog||[]),{on:today(),from:p.committed||"",to:v}]});
    else await db.doc("projects/"+id).update({[f]:v});
  }catch(err){alert("Could not save: "+(err.message||err.code||err))}
});

async function api(method,url,body){
  const r=await fetch(url,{method,headers:body!==undefined?{"Content-Type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:"same-origin"});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&me&&url!=="/api/login"){me=null;isAdmin=false;loginMsg="Your session expired. Please sign in again.";render()}
  if(!r.ok)throw new Error((j&&j.error)||("Request failed ("+r.status+")"));
  return j;
}
const COLS=["users","projects","updates","tasks"];
const subs={},lastSig={};
async function sync(c){
  try{
    const rows=await api("GET","/api/c/"+c);
    const arr=rows.map(r=>({id:r.id,...r.data}));
    const sig=JSON.stringify(arr);
    if(sig===lastSig[c])return;
    lastSig[c]=sig;
    if(c==="users")users=arr;else if(c==="projects")projects=arr;else if(c==="updates")updates=arr;else if(c==="tasks")tasks=arr;
    const cb=subs[c];
    if(cb)cb({docs:arr.map(d=>({id:d.id,data:()=>{const x={...d};delete x.id;return x}}))});
  }catch(e){}
}
function makeDb(){
  return{
    collection:c=>({
      onSnapshot(cb){subs[c]=cb;sync(c)},
      get:()=>api("GET","/api/c/"+c),
      add:async d=>{const r=await api("POST","/api/c/"+c,d);await sync(c);return r}
    }),
    doc:p=>{
      const i=p.indexOf("/"),c=p.slice(0,i),base="/api/c/"+c+"/"+encodeURIComponent(p.slice(i+1));
      return{
        get:()=>api("GET","/api/c/"+c),
        set:async d=>{const r=await api("PUT",base,d);await sync(c);return r},
        update:async d=>{const r=await api("PATCH",base,d);await sync(c);return r},
        delete:async()=>{const r=await api("DELETE",base);await sync(c);return r}
      };
    },
    reset(){for(const k in lastSig)delete lastSig[k]},
    refresh:async()=>{for(const c of COLS)await sync(c)}
  };
}
(async()=>{
  db=makeDb();
  db.collection("users").onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection("projects").onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection("updates").onSnapshot(s=>{updates=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  setInterval(()=>{if(!document.hidden&&me)db.refresh()},5000);
  try{const u=await api("GET","/api/me");me={id:u.id,name:u.name};isAdmin=u.role==="admin";tab=isAdmin?"today":"mine";await db.refresh()}catch(e){}
  render();
})();
</script></body></html>
